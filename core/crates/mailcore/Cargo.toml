[package]
name = "mailcore"
edition.workspace = true
version.workspace = true

[dependencies]
aes = "0.8"
anyhow = "1.0.104"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
chacha20poly1305 = "0.10"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
der = { version = "0.7", features = ["alloc", "pem", "oid"] }
des = "0.8"
encoding_rs = "0.8.42"
futures = "0.3.34"
hex = "0.4.3"
hickory-resolver = "0.26.3"
hmac = "0.12"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-native-certs", "hostname", "pool"] }
lol_html = { version = "3.0.1", default-features = false }
mail-builder = "1.0.0"
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
parking_lot = "0.13.0"
percent-encoding = "2.3.2"
pgp = "0.21"
pulldown-cmark = "0.13.5"
quick-xml = "0.42.0"
rand = "0.8"
rc2 = "0.8"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form", "stream"] }
rsa = { version = "0.9", features = ["sha1", "sha2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
rustls-platform-verifier = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = "0.10"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
webpki-roots = "1.0.11"
x509-cert = { version = "0.2.5", default-features = false, features = ["std", "pem"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tokio-tungstenite = "0.28"
uuid = { version = "1.29.0", features = ["v4"] }
