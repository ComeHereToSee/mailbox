[package]
name = "mailcore-ffi"
edition.workspace = true
version.workspace = true

[lib]
name = "mailcore"
crate-type = ["staticlib"]

[dependencies]
mailcore = { path = "../mailcore" }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
parking_lot = "0.12"
