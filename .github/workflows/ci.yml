name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core (Linux, Dovecot + GreenMail)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAILBOX_TEST_SERVERS: "1"
      MAILBOX_TEST_ENV: /tmp/mailbox-test-env
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install test mail servers
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq dovecot-imapd dovecot-pop3d dovecot-managesieved dovecot-sieve
          sudo systemctl stop dovecot || true
          mkdir -p /tmp/mailbox-test-env
          curl -sSL -o /tmp/mailbox-test-env/greenmail.jar \
            https://repo1.maven.org/maven2/com/icegreen/greenmail-standalone/2.1.2/greenmail-standalone-2.1.2.jar
          sudo -E scripts/test-env/start.sh
      - name: Test
        working-directory: core
        run: cargo test --workspace

  macos:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          cache-targets: false
      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build app and DMG
        run: scripts/build-macos.sh
      - name: Screenshots with demo data
        if: success()
        timeout-minutes: 6
        run: |
          APP="$PWD/macos/build/DerivedData/Build/Products/Release/Mailbox.app"
          mkdir -p /tmp/shots
          "$APP/Contents/MacOS/Mailbox" --demo > /tmp/app.log 2>&1 &
          sleep 30
          screencapture -x /tmp/shots/1-main.png || true
          open "mailbox://compose?to=lisi@corp-demo.cn&subject=%E4%BC%9A%E8%AE%AE%E7%BA%AA%E8%A6%81&body=%E4%BD%A0%E5%A5%BD"
          sleep 8
          screencapture -x /tmp/shots/2-compose.png || true
          open "mailbox://settings?tab=general"
          sleep 5
          screencapture -x /tmp/shots/3-settings.png || true
          open "mailbox://add-account"
          sleep 5
          screencapture -x /tmp/shots/4-add-account.png || true
          open "mailbox://settings?tab=crypto"
          sleep 5
          screencapture -x /tmp/shots/5-crypto.png || true
          tail -30 /tmp/app.log || true
          tail -30 "$HOME/Library/Application Support/Mailbox/logs/mailcore.log" || true
      - name: Upload screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/shots
          if-no-files-found: ignore
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: macos/build/xcodebuild.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Mailbox-dmg
          path: dist/Mailbox.dmg
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Mailbox.dmg
